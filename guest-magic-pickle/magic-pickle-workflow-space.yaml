apiVersion: platform.local.lab/v1alpha1
kind: WorkflowSpace
metadata:
  name: "magic-pickle-workflow-space"
  namespace: "guest-magic-pickle"
spec:
  parameters:
    # Temporal keeps closed workflows at least a day. The sandbox is gone long before.
    retention: "24h"
    description: "Launchpad sandbox guest-magic-pickle"
