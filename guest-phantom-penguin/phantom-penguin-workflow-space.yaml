apiVersion: platform.local.lab/v1alpha1
kind: WorkflowSpace
metadata:
  name: "phantom-penguin-workflow-space"
  namespace: "guest-phantom-penguin"
spec:
  parameters:
    # Temporal keeps closed workflows at least a day. The sandbox is gone long before.
    retention: "24h"
    description: "Launchpad sandbox guest-phantom-penguin"
