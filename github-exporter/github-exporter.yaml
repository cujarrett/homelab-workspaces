apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: github-exporter
  namespace: github-exporter
spec:
  parameters:
    image: ghcr.io/cujarrett/github-exporter:sha-bd9d8327fb9f70ef99fe35813d670c70d39da002
    port: 8080
    # Serves metrics on the traffic port, so the default 9090 would scrape nothing.
    metricsPort: 8080
    consumes:
      - { host: api.github.com }
    configFrom:
      - github-exporter-config
    managedSecretRefs:
      - name: github-exporter-token
