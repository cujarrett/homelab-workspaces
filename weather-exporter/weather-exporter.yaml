apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: weather-exporter
  namespace: weather-exporter
spec:
  parameters:
    image: ghcr.io/cujarrett/weather-exporter:sha-c86b92fa39021a4ddfd400d2c93382669ccd12b9
    repo: https://github.com/cujarrett/weather-exporter
    port: 8080
    metricsPort: 8080
