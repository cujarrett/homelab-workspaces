apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: weather-exporter
  namespace: sump-pump
spec:
  parameters:
    image: ghcr.io/cujarrett/weather-exporter:sha-fef0a12649c360c52b1a46b8c501a2c9c88ed87c
