apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: weather-exporter
  namespace: sump-pump
spec:
  parameters:
    image: ghcr.io/cujarrett/weather-exporter:sha-cdde4da9619bb8a89cbc84056a17d59a59ba4473
    repo: https://github.com/cujarrett/weather-exporter
    port: 8080
    metricsPort: 8080
