# The Shelly meter on the LAN posts readings to this node port.
# platform-service-types in the homelab repo allows it by name.
apiVersion: v1
kind: Service
metadata:
  name: sump-pump-bridge-nodeport
  namespace: sump-pump
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: sump-pump-bridge
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30880
