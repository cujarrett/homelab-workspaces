apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: my-vinyl-api
  namespace: my-vinyl
spec:
  parameters:
    image: ghcr.io/cujarrett/my-vinyl-api:sha-8352ef0c3d6ea4f50a3033296cfa86d3bb5366d5
    repo: https://github.com/cujarrett/my-vinyl-api
    port: 8080
    replicas: 1
    host: my-vinyl-api.local.lab
    tlsIssuer: local-lab-ca-issuer
    managedSecretRefs:
      - name: discogs-credentials
    cache:
      enabled: true
      backend: private-cloud
    provides:
      - name: collection
        auth: mesh
        allowedCallers:
          - { namespace: my-vinyl, app: my-vinyl }
    consumes:
      - { host: api.discogs.com }
