apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: my-vinyl-api
  namespace: my-vinyl
spec:
  parameters:
    image: ghcr.io/cujarrett/my-vinyl-api:sha-c34dd7177c9dd8cae5b56c4a1e25c021453394ad
    repo: https://github.com/cujarrett/my-vinyl-api
    port: 8080
    replicas: 1
    host: my-vinyl-api.local.lab
    managedSecretRefs:
      - name: discogs-credentials
    cache:
      enabled: true
      backend: private-cloud
    provides:
      - name: collection
        auth: mesh
        allowedCallers:
          - { namespace: my-vinyl, app: my-vinyl }
    consumes:
      - { host: api.discogs.com }
