apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: my-vinyl-api
  namespace: my-vinyl
spec:
  parameters:
    image: ghcr.io/cujarrett/my-vinyl-api:sha-a310e0c633282f037d1e020c96a34270c0adbdf3
    repo: https://github.com/cujarrett/my-vinyl-api
    port: 8080
    replicas: 1
    host: my-vinyl-api.local.lab
    tlsIssuer: local-lab-ca-issuer
    secretsFrom: [discogs-credentials]
    cache:
      enabled: true
      backend: private-cloud
    provides:
      - name: collection
        auth: mesh
        allowedCallers:
          - { namespace: my-vinyl, app: my-vinyl }
    consumes:
      - { host: api.discogs.com }
