apiVersion: platform.local.lab/v1alpha1
kind: WorkflowSpace
metadata:
  name: "velvet-pirate-workflow-space"
  namespace: "guest-velvet-pirate"
spec:
  parameters:
    # Temporal keeps closed workflows at least a day. The sandbox is gone long before.
    retention: "24h"
    description: "Launchpad sandbox guest-velvet-pirate"
