apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: authorized-api
  namespace: platform-connections-demo
spec:
  parameters:
    image: ghcr.io/cujarrett/platform-connections-demo-downstream:sha-c4876dde7ff9767160907421e9a1d3f688156e22
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    # AWS endpoints are not declared in consumes - binding to a resource is the
    # declaration, so the platform registers DynamoDB and the credential endpoints
    # from this ref alone.
    nosqlRef:
      name: records
    consumes:
      - { host: api.open-meteo.com }
      - { namespace: platform-connections-demo, app: upstream-api }
