# Cluster-internal only - no Ingress, no public hostname.
# launchpad-config is hand-created in the cluster, not in git, so it must exist
# before this applies.
apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: launchpad-api
  namespace: launchpad
spec:
  parameters:
    image: ghcr.io/cujarrett/launchpad-api:sha-a57d3f6c8c1c9cfabcd4f8c091c8c92c925af6af
    repo: https://github.com/cujarrett/launchpad-api
    port: 8080
    metricsPort: 8080
    size: sm
    configFrom: [launchpad-config]
    managedSecretRefs:
      - name: launchpad-github-token
    provides:
      - name: launchpad
        auth: mesh
        allowedCallers:
          - { namespace: launchpad, app: launchpad }
