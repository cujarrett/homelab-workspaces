# Cluster-internal only - no Ingress, no public hostname.
# launchpad-config and launchpad-github-token are hand-created in the cluster, not
# in git, so both must exist before this applies.
apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: launchpad-api
  namespace: launchpad
spec:
  parameters:
    image: ghcr.io/cujarrett/launchpad-api:sha-d3d16446654d74ca1ef3416559591d29186416cc
    repo: https://github.com/cujarrett/launchpad-api
    port: 8080
    metricsPort: 8080
    size: sm
    configFrom: [launchpad-config]
    secretsFrom: [launchpad-github-token]
