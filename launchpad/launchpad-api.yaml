# Cluster-internal only - no Ingress, no public hostname.
# launchpad-config is hand-created in the cluster, not in git, so it must exist
# before this applies.
apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: launchpad-api
  namespace: launchpad
spec:
  parameters:
    image: ghcr.io/cujarrett/launchpad-api:sha-1f1062869088c44ee42489e608ecb8eabc352f1d
    repo: https://github.com/cujarrett/launchpad-api
    port: 8080
    metricsPort: 8080
    size: sm
    configFrom: [launchpad-config]
    managedSecretRefs:
      - name: launchpad-github-token
    # Temporal deletes each guest sandbox when it expires.
    workflowSpaceRef:
      name: launchpad-cleanup
    # It watches every platform resource to stream live status to the UI.
    callsClusterApi: true
    consumes:
      - { host: api.github.com }
      # Loki holds the sandbox launch locations for the home page map.
      # It runs outside the mesh, so it is declared by its service name like an off-platform host.
      # Plain HTTP, because there is no sidecar to speak mTLS to.
      - { host: loki.monitoring.svc.cluster.local, port: 3100, protocol: HTTP }
    provides:
      - name: launchpad
        auth: mesh
        allowedCallers:
          - { namespace: launchpad, app: launchpad }
