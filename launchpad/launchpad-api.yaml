# Cluster-internal only - no Ingress, no public hostname.
# launchpad-config is hand-created in the cluster, not in git, so it must exist
# before this applies.
apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: launchpad-api
  namespace: launchpad
spec:
  parameters:
    image: ghcr.io/cujarrett/launchpad-api:sha-aa0b416e5cc3d39ce7f050d8754619223533ba5c
    repo: https://github.com/cujarrett/launchpad-api
    port: 8080
    metricsPort: 8080
    size: sm
    configFrom: [launchpad-config]
    managedSecretRefs:
      - name: launchpad-github-token
    sqlRef:
      name: launchpad-db
    # Temporal deletes each guest sandbox when it expires.
    workflowRef:
      name: launchpad-cleanup
    # It watches every platform resource to stream live status to the UI.
    callsClusterApi: true
    consumes:
      - { host: api.github.com }
    provides:
      - name: launchpad
        auth: mesh
        allowedCallers:
          - { namespace: launchpad, app: launchpad }
