apiVersion: v1
kind: Namespace
metadata:
  name: launchpad
  # Meshed. launchpad-api's apiserver watch streams skip its sidecar through callsClusterApi,
  # because the sidecar cuts long-lived watches.
  labels:
    platform.local.lab/workloads: "true"
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Prune after the XRs. A namespace that starts terminating while managed
    # resources still hold finalizers deadlocks and never finishes.
    argocd.argoproj.io/sync-wave: "-1"
