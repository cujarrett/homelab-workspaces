apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-api-xr-viewer
rules:
  - apiGroups:
      - platform.local.lab
    resources:
      - apis
      - spas
      - sqls
      - nosqls
      - objectstorages
      - topics
      - subscriptions
      - wordpresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.crossplane.io
    resources:
      - compositeresourcedefinitions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-api-xr-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-api-xr-viewer
subjects:
  - kind: ServiceAccount
    name: launchpad-api
    namespace: launchpad
---
# Allows launchpad-api to watch pods cluster-wide so it can stream init container
# binding status to SSE clients. Kubernetes RBAC cannot scope a ClusterRole to a
# namespace prefix, so the grant is cluster-wide; filtering to guest-* namespaces
# is enforced in extractPodStatus before any data is broadcast. Scoped to
# get/list/watch only - the SA cannot create, update, or delete pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-api-pod-viewer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-api-pod-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-api-pod-viewer
subjects:
  - kind: ServiceAccount
    name: launchpad-api
    namespace: launchpad
---
# launchpad-api pushes a workspace directory to Git and then tells ArgoCD to look
# now, rather than letting the sandbox wait out the ApplicationSet's 60s requeue
# or the controller's reconciliation timer. Both grants are pinned by name, which
# is what makes patch safe here - patch cannot be limited to a single field, so an
# unpinned grant would let this pod repoint any Application at another repo and
# have the cluster-admin controller apply it. The Application names are the five
# fixed demo slots; a new slot needs adding here or its sandbox silently falls
# back to waiting out the timer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-api-argo-refresh
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    resourceNames: ["xrs"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["demo1", "demo2", "demo3", "demo4", "demo5"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-api-argo-refresh
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-api-argo-refresh
subjects:
  - kind: ServiceAccount
    name: launchpad-api
    namespace: launchpad
