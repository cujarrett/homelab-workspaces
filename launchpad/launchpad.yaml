# nginx proxies /api/ → launchpad-api in-cluster; API never gets a public hostname.
# CSP extended to allow MSAL token requests to login.microsoftonline.com.
apiVersion: platform.local.lab/v1alpha1
kind: Spa
metadata:
  name: launchpad
  namespace: launchpad
spec:
  parameters:
    image: ghcr.io/cujarrett/launchpad:sha-a7b6601f689f16183c193b4b5c63737e275a5e46
    repo: https://github.com/cujarrett/launchpad
    host: launchpad.mattjarrett.dev
    size: sm
    contentSecurityPolicy: >-
      default-src 'self';
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://mattjarrett.dev https://*.mattjarrett.dev https://login.microsoftonline.com https://*.microsoftonline.com;
      frame-ancestors 'none';
      base-uri 'self';
    apiProxies:
      # nginx strips /api/ before forwarding, so upstreamPath puts it back for
      # the Go API, whose routes are registered under that prefix.
      - path: /api/
        app: launchpad-api
        upstreamPath: /api
