apiVersion: platform.local.lab/v1alpha1
kind: WorkflowSpace
metadata:
  name: "jazzy-napkin-workflow-space"
  namespace: "guest-jazzy-napkin"
spec:
  parameters:
    # Temporal keeps closed workflows at least a day. The sandbox is gone long before.
    retention: "24h"
    description: "Launchpad sandbox guest-jazzy-napkin"
