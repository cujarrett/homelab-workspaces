# The attack map on its own page.
# It runs in this workspace because a Spa proxies only to an Api in its own namespace.
apiVersion: platform.local.lab/v1alpha1
kind: Spa
metadata:
  name: jerks
  namespace: mattjarrett-dev
spec:
  parameters:
    image: ghcr.io/cujarrett/jerks:sha-3cd758dd497f58b0e9a799a745009dc3e180521e
    repo: https://github.com/cujarrett/jerks
    host: jerks.mattjarrett.dev
    contentSecurityPolicy: "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"
    replicas: 1
    size: xs
    apiProxies:
      # Only /stats is forwarded, so anything else homelab-stats serves stays private.
      - path: /api/stats/
        app: homelab-stats
        upstreamPath: /stats
