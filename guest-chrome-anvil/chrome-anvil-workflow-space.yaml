apiVersion: platform.local.lab/v1alpha1
kind: WorkflowSpace
metadata:
  name: "chrome-anvil-workflow-space"
  namespace: "guest-chrome-anvil"
spec:
  parameters:
    # Temporal keeps closed workflows at least a day. The sandbox is gone long before.
    retention: "24h"
    description: "Launchpad sandbox guest-chrome-anvil"
