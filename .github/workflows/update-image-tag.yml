on:
  workflow_call:
    inputs:
      namespace:
        description: "Override: tenant namespace (top-level directory). Defaults to the calling repo name."
        required: false
        type: string
      file:
        description: "Override: full path to the XR file. Defaults to <namespace>/<repo-name>.yaml."
        required: false
        type: string
      image:
        description: "Override: full image name without tag. Defaults to ghcr.io/cujarrett/<repo-name>."
        required: false
        type: string
    secrets:
      app_private_key:
        required: true

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Derive defaults from repo name
        id: defaults
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"  # strips "cujarrett/" prefix

          IMAGE="${{ inputs.image }}"
          if [[ -z "$IMAGE" ]]; then
            IMAGE="ghcr.io/cujarrett/${REPO_NAME}"
          fi

          NAMESPACE="${{ inputs.namespace }}"
          if [[ -z "$NAMESPACE" ]]; then
            NAMESPACE="${REPO_NAME}"
          fi

          FILE="${{ inputs.file }}"
          if [[ -z "$FILE" ]]; then
            FILE="${NAMESPACE}/${REPO_NAME}.yaml"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE"   >> "$GITHUB_OUTPUT"

      # Commits through this token are credited to homelab-workspaces-deployer[bot]
      # and signed by GitHub.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liC9AQ1xrWzEe4nX
          private-key: ${{ secrets.app_private_key }}
          repositories: homelab-workspaces

      - name: Update image tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          FILE="${{ steps.defaults.outputs.file }}"
          IMAGE="${{ steps.defaults.outputs.image }}"
          REPO=cujarrett/homelab-workspaces
          SHA_TAG=sha-${GITHUB_SHA}

          # Every repo commits to this one, so a push that lands between the read
          # and the write returns 409. Re-read and retry rather than fail the deploy.
          for attempt in 1 2 3 4 5; do
            FILE_SHA=$(gh api /repos/$REPO/contents/$FILE --jq '.sha')
            CONTENT=$(gh api /repos/$REPO/contents/$FILE --jq '.content' | tr -d '\n' | base64 -d)
            UPDATED=$(echo "$CONTENT" | sed "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHA_TAG}|")

            if gh api --method PUT /repos/$REPO/contents/$FILE \
              -f message="chore: deploy ${IMAGE##*/} ${SHA_TAG}" \
              -f content="$(echo "$UPDATED" | base64 -w 0)" \
              -f sha="$FILE_SHA"; then
              exit 0
            fi

            echo "attempt $attempt lost a race, retrying"
            sleep $((attempt * 5))
          done

          echo "could not update $FILE after 5 attempts"
          exit 1
