apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: homelab-stats
  namespace: homelab-stats
spec:
  parameters:
    image: ghcr.io/cujarrett/homelab-stats:sha-b0404a85617fe7ac9f3bd33f72eb9357bff98495
    repo: https://github.com/cujarrett/homelab-stats
    port: 8080
    metricsPort: 8080
    replicas: 1
    size: xs
    managedSecretRefs:
      - name: cloudflare-token
    # No host. Only the two sites' nginx pods reach this, through apiProxies.
    provides:
      - name: stats
        auth: mesh
        allowedCallers:
          - { namespace: mattjarrett-dev, app: mattjarrett-dev }
          - { namespace: jerks, app: jerks }
    consumes:
      # Prometheus runs outside the mesh, so it is declared by its service name like
      # an off-platform host. Plain HTTP, because there is no sidecar to speak mTLS to.
      - { host: monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local, port: 9090, protocol: HTTP }
      - { host: prometheus-cluster-availability.monitoring.svc.cluster.local, port: 9090, protocol: HTTP }
      # Loki holds the Traefik access logs behind the attack map. It runs outside the mesh too.
      - { host: loki.monitoring.svc.cluster.local, port: 3100, protocol: HTTP }
      # The blog-stats gist, for the automerge chart.
      - { host: api.github.com }
      # Cloudflare's analytics, for the requests it stopped before they reached the cluster.
      - { host: api.cloudflare.com }
